name: build nvidia.raw

on:
  workflow_dispatch:
    inputs:
      nvidia_driver_version:
        description: 'NVIDIA proprietary driver version (must match the nvidia-smi version TrueNAS ships)'
        required: true
        default: '570.172.08'
        type: string
      kernel_release:
        description: 'TrueNAS kernel release (uname -r on the NAS)'
        required: true
        default: '6.12.33-production+truenas'
        type: string
      kernel_headers_dir:
        description: 'Directory inside /usr/src that the headers .deb installs to'
        required: true
        default: 'linux-headers-truenas-production-amd64'
        type: string
      kernel_headers_url:
        description: 'URL to the TrueNAS linux-headers .deb'
        required: true
        default: 'https://download.truenas.com/TrueNAS-SCALE-Goldeye/25.10.0/packages/linux-headers-truenas-production-amd64_6.12.33-production+truenas-1_amd64.deb'
        type: string
      kernel_image_url:
        description: 'URL to the TrueNAS linux-image .deb (used to regenerate modules.dep)'
        required: true
        default: 'https://download.truenas.com/TrueNAS-SCALE-Goldeye/25.10.0/packages/linux-image-truenas-production-amd64_6.12.33-production+truenas-1_amd64.deb'
        type: string
      orig_raw_url:
        description: 'URL the runner can fetch the stock TrueNAS nvidia.raw from (leave empty to use the NVIDIA-repo fallback for the container toolkit)'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner has no route to the NAS, so the stock raw has to be reachable
      # over HTTP or we fall back to fetching the container toolkit from NVIDIA.
      - name: Fetch stock nvidia.raw
        id: orig
        env:
          ORIG_RAW_URL: ${{ inputs.orig_raw_url }}
        run: |
          if [ -n "$ORIG_RAW_URL" ]; then
            mkdir -p orig
            curl -fSsL --retry 3 -o orig/nvidia.raw "$ORIG_RAW_URL"
            file orig/nvidia.raw
            echo "ctk_fallback=0" >> "$GITHUB_OUTPUT"
          else
            echo "ctk_fallback=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build nvidia.raw
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tn-nvidia-legacy-builder:ci
          build-args: |
            NVIDIA_DRIVER_VERSION=${{ inputs.nvidia_driver_version }}
            KERNEL_RELEASE=${{ inputs.kernel_release }}
            KERNEL_HEADERS_DIR=${{ inputs.kernel_headers_dir }}
            KERNEL_HEADERS_URL=${{ inputs.kernel_headers_url }}
            KERNEL_IMAGE_URL=${{ inputs.kernel_image_url }}
            CTK_FALLBACK=${{ steps.orig.outputs.ctk_fallback }}

      - name: Extract artifact
        run: |
          mkdir -p out
          docker run --rm tn-nvidia-legacy-builder:ci > out/nvidia.raw
          ls -lh out/nvidia.raw
          file out/nvidia.raw

      - name: Job summary
        if: always()
        env:
          CTK_FALLBACK: ${{ steps.orig.outputs.ctk_fallback }}
        run: |
          {
            echo "### nvidia.raw build"
            echo
            echo "- driver: \`${{ inputs.nvidia_driver_version }}\` (proprietary)"
            echo "- kernel: \`${{ inputs.kernel_release }}\`"
            if [ "$CTK_FALLBACK" = "1" ]; then
              echo "- base: **none** — no \`orig_raw_url\` given, so this build did **not** overlay onto TrueNAS's stock \`nvidia.raw\`."
              echo "- The container toolkit was pulled from NVIDIA's apt repo, but the rest of the stock userland (libcuda, NVENC/NVDEC, ...) is **not** in this artifact — installing it over the shipped raw drops those libraries."
              echo "- Re-run with \`orig_raw_url\` pointing at a copy of \`/usr/share/truenas/sysext-extensions/nvidia.raw\` for a complete build."
              echo "- \`/etc/nvidia-container-runtime/config.toml\` is not covered by a sysext and must already exist on the host."
            else
              echo "- base: stock \`nvidia.raw\` from \`${{ inputs.orig_raw_url }}\` (container toolkit and full driver userland preserved)"
            fi
            echo "- Vulkan: ICD manifest, \`libGLX_nvidia\`/\`libnvidia-glvkspirv\`/… and \`nvidia-legacy-modules.service\` (loads \`nvidia-modeset\` at boot) are included."
            echo "- In containers the graphics libraries are only bind-mounted when \`NVIDIA_DRIVER_CAPABILITIES\` includes \`graphics\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload nvidia.raw
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-${{ inputs.nvidia_driver_version }}-${{ inputs.kernel_release }}
          path: out/nvidia.raw
          if-no-files-found: error
